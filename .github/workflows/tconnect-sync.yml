name: tconnect -> Nightscout sync

on:
  schedule:
    - cron: '*/5 * * * *'   # každých 5 minut
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install tconnectsync + dependencies
        run: |
          python -m pip install --upgrade pip
          # pokusíme se postupně o několik referencí - první, která projde, se použije
          pip install "git+https://github.com/jwoglom/tconnectsync.git@main" || \
          pip install "git+https://github.com/jwoglom/tconnectsync.git@master" || \
          pip install "git+https://github.com/jwoglom/tconnectsync.git@HEAD" || \
          pip install "git+https://github.com/jwoglom/tconnectsync.git"

       - name: Run tconnectsync (one-shot)
          env:
            TCONNECT_EMAIL: ${{ secrets.TCONNECT_EMAIL }}
            TCONNECT_PASSWORD: ${{ secrets.TCONNECT_PASSWORD }}
            NS_URL: ${{ secrets.NS_URL }}
            NS_SECRET: ${{ secrets.NS_SECRET }}
            TIMEZONE_NAME: ${{ secrets.TIMEZONE_NAME }}
          run: |
            # Explicitně nastavíme region na EU (bezpečné — není to secret)
            export TCONNECT_REGION="EU"
            echo "For debug: forcing TCONNECT_REGION=$TCONNECT_REGION"
            # spustíme tconnectsync
            python3 -m tconnectsync

